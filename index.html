<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>こころの庭</title>
<meta name="description" content="過食しなかった日を記録して、花や動物を育てるアプリ">
<meta name="theme-color" content="#FBF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1C19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="こころの庭">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main id="main" tabindex="-1"></main>
  <nav aria-label="メニュー">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H4Z"/></svg>ホーム</button>
    <button data-tab="garden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 21 V11 M12 14 C8 14 6 11 6 8 C9 8 12 10 12 14Z M12 12 C16 12 18 9 18 6 C15 6 12 8 12 12Z"/><path d="M3 21 H21"/></svg>庭・カレンダー</button>
    <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12 H21 A9 8 0 0 1 3 12Z"/><path d="M9 4 C8 6 10 7 9 9 M15 4 C14 6 16 7 15 9"/></svg>食費</button>
    <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3 V6 M12 18 V21 M3 12 H6 M18 12 H21 M5.6 5.6 L7.8 7.8 M16.2 16.2 L18.4 18.4 M5.6 18.4 L7.8 16.2 M16.2 7.8 L18.4 5.6"/></svg>設定</button>
  </nav>
  <button class="sos" id="sosBtn" aria-label="SOS 衝動が来たとき">SOS</button>
  <div id="layer"></div>
</div>
<noscript><p style="padding:24px">このアプリを使うには、JavaScriptをオンにしてください。</p></noscript>
<script src="app.js"></script>
</body>
</html>
